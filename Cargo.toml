[package]
name = "agent_terminal"
version = "0.1.0"
edition = "2024"

# vendored alacritty_terminal 必须是 workspace 成员，否则它的 180 个测试永远跑不到：
# path 依赖 + 非成员的组合会让 `cargo test -p alacritty_terminal` 直接报
# "requires dev-dependencies and is not a member of the workspace"。
# 我们自己在它里面加了 sixel 支持（见 vendor/alacritty_terminal/VENDOR.md），
# 那部分改动尤其需要上游测试兜住。
[workspace]
members = ["vendor/alacritty_terminal"]

[dependencies]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
anyhow = "1"
async-channel = "2"
clap = { version = "4.5", features = ["derive"] }
cocoa = "0.26"
fontdb = "0.23"
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "19c8363a8e0d8a2f7a7181bab2c14d87390c0f25", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "19c8363a8e0d8a2f7a7181bab2c14d87390c0f25", default-features = false, features = ["font-kit"] }
image = "0.25"
objc = "0.2"
parking_lot = "0.12"
portable-pty = "0.9.0"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ttf-parser = "0.25"
